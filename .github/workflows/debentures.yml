name: Atualizar debêntures ANBIMA

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debentures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python debentures.py
      - name: Salvar bases no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p downloads/debentures bases
          git add downloads/debentures bases
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados de debêntures ANBIMA"
            git push
          fi
